name: Pridat navigaciu na bod

on:
  push:
    paths:
      - '.github/workflows/add-point-navigation.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pridaj navigaciu do index.html
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          payload = ''''''
          open('/tmp/navigation.patch','wb').write(gzip.decompress(base64.b64decode(payload)))
          PY
          git apply --check /tmp/navigation.patch
          git apply /tmp/navigation.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Pridat navigaciu na vybrany bod"
          git push
