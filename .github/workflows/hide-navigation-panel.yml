name: Skryt panel navigacie

on:
  push:
    paths:
      - '.github/workflows/hide-navigation-panel.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skry panel navigacie
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '</style>'
          rule = '\n/* Panel navigácie je zámerne skrytý, navigácia zostáva aktívna. */\n.navigation-panel, .navigation-panel.visible { display: none !important; }\n'
          if rule.strip() in text:
              raise SystemExit('Panel je uz skryty')
          if marker not in text:
              raise SystemExit('Nenasiel sa koniec CSS')
          text = text.replace(marker, rule + marker, 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Skryt panel navigacie"
          git push
