name: Vypnut automaticke ortofoto

on:
  push:
    paths:
      - '.github/workflows/disable-auto-ortofoto.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vypni automaticke ortofoto
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = "        if (isJtskMetersDrawing()) setOrtoEnabled(true);\n"
          if old not in text:
              raise SystemExit('Ocakavany riadok sa nenasiel')
          text = text.replace(old, "", 1)
          p.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Vypnut automaticke zapinanie ortofota"
          git push
